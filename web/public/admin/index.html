<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>從薪開始｜遊玩紀錄後台</title><link rel="stylesheet" href="./style.css"><script src="../config.js"></script><script src="./app.js" defer></script></head><body>
<header><div><small>從薪開始 · 管理者專用</small><h1>遊玩紀錄</h1></div><button id="logout" hidden>登出</button></header>
<main><section id="login"><h2>登入後台</h2><p>只有管理者能查看玩家紀錄。</p><form id="loginForm"><label>管理者信箱<input id="email" type="email" autocomplete="username" required></label><label>管理密碼<input id="password" type="password" autocomplete="current-password" required></label><button>登入</button></form></section>
<p id="message" role="status"></p><div id="dashboard" hidden>
<section><form id="filters"><label>搜尋玩家<input id="query" placeholder="暱稱或匿名玩家編號"></label><label>紀錄範圍<select id="trash"><option value="false">正常紀錄</option><option value="true">回收筒</option></select></label><label>對局狀態<select id="status"><option value="">全部</option><option value="finished">已結束</option><option value="in_progress">進行中／未完成</option></select></label><label>資料來源<select id="source"><option value="">全部</option><option value="solo_client">單人回傳</option></select></label><button>查詢／更新</button></form><p class="note">匿名編號代表此瀏覽器的遊玩身分，不是真實姓名；清除網站資料或更換裝置會產生新編號。單人成績由玩家端回傳，未經伺服器驗證。進行中紀錄顯示最後成功同步狀態。</p></section>
<section><div class="bar"><h2 id="total">對局列表</h2><button id="csv">匯出本頁 CSV</button></div><div class="table"><table><thead><tr><th>最近同步</th><th>模式／來源</th><th>狀態</th><th>玩家</th><th>回合</th><th>操作</th></tr></thead><tbody id="matches"></tbody></table></div><div class="bar"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></section>
<section id="detail" hidden><div class="bar"><h2>對局詳情</h2><button id="closeDetail">收合</button></div><p id="matchMeta"></p><div id="players"></div></section>
</div></main></body></html>
