name: Publish game
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore game package
        run: |
          cat release-0.5.5.zip.part-* > site-package.zip
          echo '9ebd1792dde8e44bb4bba324d095a5a59351d03bf3d12f8fe49d75c864505a92  site-package.zip' | sha256sum -c -
          unzip -q site-package.zip -d bundle
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: bundle/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4







