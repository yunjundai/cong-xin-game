name: Publish game
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore game package
        run: |
          cat release-0.5.4.zip.part-* > site-package.zip
          echo '1c9ecf1ee9fecf3f7d9cb8ed745a248ec6b5b72f50604dc060e33a1096654b48  site-package.zip' | sha256sum -c -
          unzip -q site-package.zip -d bundle
          if [ -f admin-app.js ]; then cp admin-app.js bundle/site/admin/app.js; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: bundle/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4



