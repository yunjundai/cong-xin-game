name: Publish game
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore game package
        run: |
          cat site-package.zip.part-* > site-package.zip
          echo '31f812fb88acf8b1927925c294e2c1a17dd58939a69f6c2dfecabac563ca45c7  site-package.zip' | sha256sum -c -
          unzip -q site-package.zip -d bundle
          if [ -f admin-app.js ]; then cp admin-app.js bundle/site/admin/app.js; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: bundle/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
