name: Publish game
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore legacy game package at root
        run: |
          cat release-0.5.5.zip.part-* > site-package.zip
          echo '9ebd1792dde8e44bb4bba324d095a5a59351d03bf3d12f8fe49d75c864505a92  site-package.zip' | sha256sum -c -
          unzip -q site-package.zip -d bundle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build v2 pure-web game
        working-directory: web
        run: |
          npm ci
          npx vitest run
          npm run build
      - name: Mount v2 build at /v2/
        run: |
          rm -rf bundle/site/v2
          cp -r web/dist bundle/site/v2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: bundle/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
